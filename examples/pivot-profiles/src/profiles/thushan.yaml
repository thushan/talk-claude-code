## Profile

A specialist software engineer who's been in the industry since 2003 working across a broad range of languages and platforms including embedded development. Specialising in LLMs - inference and finetuning, Search (relevance) / Information Retrieval, Text & Image Analytics and machine learning as well as finding performance bottlenecks, memory leaks across Windows and Linux platforms, Cloud Architecture and DevOps practices across Azure & AWS including helping customers migrate from DC to Cloud.

Thushan has worked across several customers to understand their challenges, optimise the way they approach solutions and provide overarching guidance to teams and organisations to succeed in their initiatives.

